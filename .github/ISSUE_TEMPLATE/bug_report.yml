name: Bug report
description: Report a problem loading, editing, or saving an astronomy image.
body:
  - type: input
    id: plugin-version
    attributes:
      label: AstroFiles version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Paint.NET version and Windows architecture
      description: Include the full build number from Help > About.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the file format, actions taken, and any save options.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the full error text if available.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example file or screenshots
      description: A small synthetic FITS/XISF file helps. Share only data you may publish.
